<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>EcoEnergy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>EcoEnergy</h1>

<form id="formEquipamento">
    <input type="text" id="nome" placeholder="Nome">
    <input type="number" id="consumo" placeholder="Consumo">

</form>

<ul id="lista"></ul>

<script src="app.js"></script>
</body>
</html>
